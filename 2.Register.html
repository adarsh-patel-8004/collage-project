<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Career Guidance</title>

    <link rel="stylesheet" href="2Register.css">

</head>

<body>

    <div class="register-container">


        <div class="register-left">

            <h1>Join Our</h1>

            <h1 class="blue-text">
                Career Platform
            </h1>

            <p>
                Create your account and discover
                the right career path for you.
            </p>

            <div class="ai-icon">
                🤖
            </div>

        </div>


        <div class="register-right">

            <div class="register-box">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Register for your account
                </p>


                <form action="3.dashboard.html" method="get">

                    <div class="input-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <p class="login-text">

                    Already have an account?

                    <a href="1.login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>
    <script>

    //function registerUser(event) {

    //    event.preventDefault();

    //    window.location.href = "dashboard.html";

//}

</script>
</body>
</html>
