<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Career Guidance</title>

    <link rel="stylesheet" href="1login.css">
</head>

<body>

    <div class="login-container">

        
        <div class="login-left">

            <h1>AI-Based</h1>

            <h1 class="blue-text">
                Career Guidance
            </h1>

            <p>
                Smart Career Decisions Powered by
                Artificial Intelligence.
            </p>

            <div class="ai-icon">
                🤖
            </div>

        </div>

        <div class="login-right">

            <div class="login-box">

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to your account
                </p>

                <form action="3.dashboard.html" method="get">

                    <div class="input-group">
                        <label>Email</label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label>Password</label>

                        <input
                            type="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="remember">

                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="register-text">
                    Don't have an account?

                    <a href="2.Register.html">
                        Register
                    </a>
                </p>

            </div>

        </div>

    </div>

</script> 
</body>
</html>
